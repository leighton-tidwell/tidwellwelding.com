version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      # Pinned so the Monday 10:00 Central Claude routine that rolls these
      # PRs into one upgrade always runs after they open.
      day: monday
      time: "08:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    groups:
      # Everything non-breaking in one PR.
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # Majors stay grouped but separate, so the risky one is obvious.
      major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      # Pinned so the Monday 10:00 Central Claude routine that rolls these
      # PRs into one upgrade always runs after they open.
      day: monday
      time: "08:00"
      timezone: America/Chicago
    groups:
      actions:
        patterns: ["*"]
