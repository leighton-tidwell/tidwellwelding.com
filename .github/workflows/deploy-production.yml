name: Deploy production

# The only sanctioned path to tidwellwelding.com. Production used to be built
# by hand on a dev machine, where `.env.local` outranks `.env.production` and
# froze a `convex dev` URL into the shipped bundle — the live site then read and
# wrote the DEV Convex deployment.
#
# Here CONVEX_DEPLOY_KEY picks the deployment and `--cmd-url-env-var-name` feeds
# that same deployment's URL into the build, so the backend and the client
# bundle cannot disagree. scripts/assert-production-convex-url.mjs is the
# backstop if they ever do.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two production deploys race; queue instead of cancelling, so a
# half-finished deploy is not abandoned mid-flight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: make install

      # Hard gate: a red suite must never reach production.
      - name: Unit and integration tests
        run: make test

      # Pushes backend functions to the production Convex deployment (chosen by
      # CONVEX_DEPLOY_KEY — note there is no --preview-name here), then runs the
      # Worker build with that deployment's URL exported as
      # NEXT_PUBLIC_CONVEX_URL. The guard runs first, inside the same --cmd, so
      # it sees exactly the env the build will inline.
      - name: Convex production deploy + build
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          npx convex deploy \
            --cmd 'node scripts/assert-production-convex-url.mjs && pnpm exec opennextjs-cloudflare build' \
            --cmd-url-env-var-name NEXT_PUBLIC_CONVEX_URL

      # Deploys the production Worker from the committed root config, which owns
      # the tidwellwelding.com / www routes.
      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      # Read-only: page loads, headings, structured data, robots. Never submits
      # a form, so production data and email are untouched.
      - name: Smoke-check production
        run: make smoke URL=https://tidwellwelding.com
