name: PR preview teardown

# Deletes the preview Worker when the PR is merged, closed, or has the label
# removed. Merging counts as closing, so both paths are covered by `closed`.
on:
  pull_request:
    types: [closed, unlabeled]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false # never cancel a teardown mid-delete

jobs:
  teardown:
    # On close: only if the PR was ever labeled (labels survive closing).
    # On unlabeled: only when the removed label is the one that deploys.
    if: |
      (github.event.action == 'closed' &&
        contains(github.event.pull_request.labels.*.name, 'deploy-environment')) ||
      (github.event.action == 'unlabeled' &&
        github.event.label.name == 'deploy-environment')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Delete preview Worker
        id: delete
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          NAME="tidwellwelding-pr-${{ github.event.pull_request.number }}"
          # A PR closed without ever being labeled has no Worker; that is not a
          # failure, so swallow the error and report what happened either way.
          if pnpm exec wrangler delete "$NAME" --force 2>&1 | tee delete.log; then
            echo "deleted=true" >> "$GITHUB_OUTPUT"
          else
            echo "deleted=false" >> "$GITHUB_OUTPUT"
          fi
          cat delete.log

      - name: Note the teardown on the PR
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DELETED: ${{ steps.delete.outputs.deleted }}
        with:
          script: |
            const n = process.env.PR_NUMBER;
            const ok = process.env.DELETED === 'true';
            const body = [
              '<!-- tsws-preview -->',
              ok
                ? `**Preview torn down.** Worker \`tidwellwelding-pr-${n}\` deleted; the preview URL is gone.`
                : `**Preview teardown ran.** No Worker \`tidwellwelding-pr-${n}\` was found to delete.`,
              '',
              `The Convex preview deployment \`pr-${n}\` holds only throwaway data and expires on its own.`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = Number(n);
            const existing = (
              await github.rest.issues.listComments({ owner, repo, issue_number })
            ).data.find((c) => c.body?.includes('<!-- tsws-preview -->'));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
