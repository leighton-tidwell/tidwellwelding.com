name: CI

# Every PR, no label needed. This is the merge gate: the `ci` check must stay
# required on main in branch protection, which lives in repo settings, not here.
# The steps live in the Makefile; this file only calls `make ci`,
# and deploy-production.yml runs that same target again on main before shipping,
# so nothing reaches production on a subset of the checks.
on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # pr-size diffs against the merge base
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: make install
      - run: make ci
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
